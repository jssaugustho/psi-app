events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolver DNS interno do Docker para atualização dinâmica
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Mapeamento para suporte a WebSockets
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # 🏥 Rota de Health Check do Gateway
        location /health {
            default_type application/json;
            return 200 '{"status":"operational","gateway":"nginx"}';
        }

        location = / {
            default_type application/json;
            return 200 '{"status":"operational","gateway":"nginx"}';
        }

        # 🔑 Rota para o GoTrue (Supabase Auth)
        location /auth/v1/ {
            proxy_pass http://gotrue:9999/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 📝 Rota para o PostgREST (com conversão de cookie HttpOnly e CORS com credentials)
        location /rest/v1/ {
            set $auth_header $http_authorization;
            if ($cookie_access_token != "") {
                set $auth_header "Bearer $cookie_access_token";
            }
            proxy_set_header Authorization $auth_header;

            # Oculta os cabeçalhos nativos do PostgREST para evitar duplicação de CORS no navegador
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;

            set $cors_origin $http_origin;
            if ($cors_origin = "") {
                set $cors_origin "*";
            }

            # Suporte completo a CORS com credentials para PostgREST
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Prefer,Prefer-Representation,x-client-app,x-client-url' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '$cors_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Content-Location' always;

            proxy_pass http://postgrest:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }


        # ⚡ Rota para a Fastify API (com suporte a WebSockets/Socket.io)
        location /v1/ {
            proxy_pass http://api:5000/;
            
            # Cabeçalhos padrão de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cabeçalhos necessários para WebSockets (Socket.io)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # Evita timeout precoce na conexão WebSocket
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
