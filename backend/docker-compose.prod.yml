# ==============================================================================
# 🚀 PSI App - Docker Compose Production Config
# Arquivo de orquestração Docker Compose otimizado para Produção e CI/CD.
# Executado via GitHub Actions em VPS com Runner Self-Hosted.
# ==============================================================================

services:
  # 🐘 PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: psi-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?A variável POSTGRES_PASSWORD é obrigatória no .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./.docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # 🔑 GoTrue (Supabase Auth)
  gotrue:
    image: supabase/gotrue:v2.189.0
    container_name: psi-gotrue-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?A variável POSTGRES_PASSWORD é obrigatória no .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=auth,public"
      GOTRUE_DB_SEARCH_PATH: auth,public
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?A variável JWT_SECRET é obrigatória no .env}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: ${GOTRUE_JWT_DEFAULT_GROUP_NAME:-authenticated}
      GOTRUE_JWT_AUD: ${GOTRUE_JWT_AUD:-authenticated}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:?A variável GOTRUE_SITE_URL é obrigatória no .env}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-http://localhost:3000/*}
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://localhost:8000/auth/v1}
      GOTRUE_API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://localhost:8000/auth/v1}
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-false}
      GOTRUE_DB_DRIVER: postgres
      PORT: 9999
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # 📝 PostgREST
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: psi-postgrest-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?A variável POSTGRES_PASSWORD é obrigatória no .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?A variável JWT_SECRET é obrigatória no .env}
      PGRST_SERVER_PORT: 3000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # 🐇 RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: psi-rabbitmq-prod
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?A variável RABBITMQ_DEFAULT_PASS é obrigatória no .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # 🟢 Nginx API Gateway / Proxy Reverso
  nginx:
    image: nginx:alpine
    container_name: psi-nginx-prod
    restart: unless-stopped
    depends_on:
      gotrue:
        condition: service_started
      postgrest:
        condition: service_started
      api:
        condition: service_healthy
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${NGINX_PORT:-8000}:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # ⚡ Fastify API (Application)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psi-api-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?A variável POSTGRES_PASSWORD é obrigatória no .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:?A variável RABBITMQ_DEFAULT_PASS é obrigatória no .env}@rabbitmq:5672"
      JWT_SECRET: ${JWT_SECRET:?A variável JWT_SECRET é obrigatória no .env}
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:?A variável SERVICE_SECRET_KEY é obrigatória no .env}
      GOTRUE_URL: ${GOTRUE_URL:-http://gotrue:9999}
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:?A variável GOTRUE_SITE_URL é obrigatória no .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_SOBRENOME: ${BOOTSTRAP_ADMIN_SOBRENOME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_TELEFONE: ${BOOTSTRAP_ADMIN_TELEFONE:-}
      PORT: 5000
      NODE_ENV: production
    command: npm run start:api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # ⚙️ TS Workers (Application)
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: psi-workers-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?A variável POSTGRES_PASSWORD é obrigatória no .env}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:?A variável RABBITMQ_DEFAULT_PASS é obrigatória no .env}@rabbitmq:5672"
      JWT_SECRET: ${JWT_SECRET:?A variável JWT_SECRET é obrigatória no .env}
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:?A variável SERVICE_SECRET_KEY é obrigatória no .env}
      GOTRUE_URL: ${GOTRUE_URL:-http://gotrue:9999}
      NODE_ENV: production
    command: npm run start:worker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

  # ☁️ Cloudflare Tunnel (Proxy reverso seguro para expor o gateway)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: psi-tunnel-prod
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel run
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - psi-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  psi-network:
    driver: bridge
