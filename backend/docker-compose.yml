services:
  # 🐘 PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: foxbase-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foxbase_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foxbase-network

  # 🔑 GoTrue (Supabase Auth)
  gotrue:
    image: supabase/gotrue:v2.189.0
    container_name: foxbase-gotrue
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foxbase_secure_pwd}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable&search_path=auth,public"
      GOTRUE_DB_SEARCH_PATH: auth,public
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-foxbase_super_secret_jwt_token_for_local_dev_32_chars}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_SITE_URL: ${GOTRUE_SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_SITE_URL:-http://localhost:3000}/*
      API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://localhost:8000/auth/v1}
      GOTRUE_API_EXTERNAL_URL: ${GOTRUE_API_EXTERNAL_URL:-http://localhost:8000/auth/v1}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DB_DRIVER: postgres
      PORT: 9999
    networks:
      - foxbase-network

  # 📝 PostgREST
  postgrest:
    image: postgrest/postgrest:v12.0.2
    container_name: foxbase-postgrest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foxbase_secure_pwd}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-foxbase_super_secret_jwt_token_for_local_dev_32_chars}
      PGRST_SERVER_PORT: 3000
    networks:
      - foxbase-network

  # 🐇 RabbitMQ Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: foxbase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - foxbase-network

  # 🟢 Nginx API Gateway / Proxy Reverso
  nginx:
    image: nginx:alpine
    container_name: foxbase-nginx
    depends_on:
      - gotrue
      - postgrest
      - api
      - upload
    volumes:
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    networks:
      - foxbase-network
      
  # ⚡ Fastify API (Application)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxbase-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foxbase_secure_pwd}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672"
      JWT_SECRET: ${JWT_SECRET:-foxbase_super_secret_jwt_token_for_local_dev_32_chars}
      SERVICE_SECRET_KEY: ${SERVICE_SECRET_KEY:-c3d9a7e1-8f2b-4d5c-9e1a-6f4b3a2c1d0e}
      GOTRUE_URL: ${GOTRUE_URL:-http://gotrue:9999}
      PORT: 5000
      NODE_ENV: development
    command: npm run dev:api
    ports:
      - "5000:5000"
    networks:
      - foxbase-network

  # 📤 API de Upload e Otimização de Imagens (Microsserviço separado)
  upload:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxbase-upload
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foxbase_secure_pwd}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:-foxbase_super_secret_jwt_token_for_local_dev_32_chars}
      PORT: 5001
      NODE_ENV: development
    command: npm run dev:upload
    ports:
      - "5001:5001"
    networks:
      - foxbase-network

  # ⚙️ TS Workers (Application)
  workers:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foxbase-workers
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-foxbase_secure_pwd}@postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672"
      JWT_SECRET: ${JWT_SECRET:-foxbase_super_secret_jwt_token_for_local_dev_32_chars}
      NODE_ENV: development
    command: npm run dev:worker
    networks:
      - foxbase-network

  # ☁️ Cloudflare Tunnel (Proxy reverso seguro para expor o gateway)
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: foxbase-tunnel
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - foxbase-network

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  foxbase-network:
    driver: bridge
